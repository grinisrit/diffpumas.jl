schema_version: 1
dataset_name: gran_sasso_lvd_raytracing_geometry
source_pdf: "Doc - 09.09.2025 - 13-04.pdf"
source_type: scanned_pdf_manual_extraction
notes:
  - "Distances and interval boundaries are approximate where derived from blurred profile axes."
  - "The original report uses 4 effective material classes for A/Z/rho calculations."
  - "Visible debris or morainic cover is kept as a separate interval label here, but it maps to the report's effective sandstone_marl class for transport properties."

coordinate_convention:
  detector_reference: "Gran Sasso underground laboratories / LVD reference point used in the report sections"
  section_definition:
    right_side_corresponds_to_phi: true
    left_side_corresponds_to_phi_plus_180_deg: true
  units:
    distance: km
    elevation: m
    density: g_cm3

formation_code_map:
  Sb: "Scisti bituminosi"
  Dl: "Dolomie"
  Cm: "Calcare massiccio"
  Co: "Corniola"
  Va: "Verde ammonitico"
  Ce: "Calcareniti ad entrochi"
  Ma: "Maiolica"
  Cr: "Calciruditi a rudiste"
  Sr: "Scaglia rossa"
  Sc: "Scaglia cinerea"
  Cn: "Calcareniti macroforam."
  Crv: "Calcareniti a Marne rosse e verdi"
  Crn: "Calcareniti a spicole di spugne"
  Cg: "Calcareniti a glauconite"
  Mc: "Marne con cerrogna"
  Mo: "Marne ad orbulina"
  La6: "Laga Flysch"
  La7: "Laga Flysch"
  Dt: "Detrito eluviale"
  Mo1: "Depositi morenici"
  Mo2: "Depositi morenici"
  Mo3: "Depositi morenici"

effective_material_classes:
  limestone:
    density_g_cm3: 2.71
    mean_Z: 11.43
    mean_A: 22.90
    included_formations: [Sb, Dl, Cm, Co, Ce, Ma, Cr, Cn, Cg]
  limestone_marl:
    density_g_cm3: 2.60
    mean_Z: 10.94
    mean_A: 21.96
    included_formations: [Va, Sr, Sc, Crv, Crn]
  marl:
    density_g_cm3: 2.55
    mean_Z: 10.49
    mean_A: 21.12
    included_formations: [Mc, Mo]
  sandstone_marl:
    density_g_cm3: 2.50
    mean_Z: 10.34
    mean_A: 20.76
    included_formations: [La6, La7, Dt, Mo1, Mo2, Mo3]

visual_material_aliases:
  debris:
    description: "Visible detrital or morainic cover in the profile figures"
    effective_class_for_transport: sandstone_marl
    typical_formations: [Dt, Mo1, Mo2, Mo3]

sections:
