            side: NW
            distance_km_from_detector: 1.0
            approximate: true
        intervals:
          - start_km: 0.0
            end_km: 5.0
            material_mode: homogeneous
            visual_material: limestone
            effective_material: limestone
            confidence: medium
          - start_km: 5.0
            end_km: 7.0
