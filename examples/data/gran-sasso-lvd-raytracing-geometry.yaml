    name: "Section 1"
    direction: "NW-SE"
    phi_deg: 135.0
    sides:
      left:
        label: NW
        max_distance_km: 15.0
        topographic_anchors:
          - description: "Crosses M. Aquila"
            elevation_m: 2500
